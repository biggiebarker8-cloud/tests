name: LarkAISolutionsConsultant
options:
  bundleIdPrefix: com.creatoralliancenetwork
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  ConsultantCore:
    path: .
targets:
  LarkAISolutionsConsultantApp:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
    dependencies:
      - package: ConsultantCore
        product: LarkAISolutionsConsultant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatoralliancenetwork.consultant.personal.local
        SWIFT_VERSION: '6.0'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        INFOPLIST_KEY_CFBundleDisplayName: 'Pocket Consultant'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Lark AI Consultant uses the microphone only while you tap voice input to transcribe speech on this device.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Lark AI Consultant uses on-device speech recognition to turn your spoken words into editable text.'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  LarkAISolutionsConsultantApp:
    build:
      targets:
        LarkAISolutionsConsultantApp: all

