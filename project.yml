name: LarkAISolutionsConsultant
options:
  bundleIdPrefix: com.creatoralliancenetwork
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  ConsultantCore:
    path: .
targets:
  LarkAISolutionsConsultantApp:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
    dependencies:
      - package: ConsultantCore
        product: LarkAISolutionsConsultant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatoralliancenetwork.larkconsultant
        SWIFT_VERSION: '6.0'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  LarkAISolutionsConsultantApp:
    build:
      targets:
        LarkAISolutionsConsultantApp: all
